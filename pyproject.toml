[project]
name = "electro"
version = "0.1.0"
description = "Python package for generating ELECTRO sampling trajectories for 3D MRI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo[recommended]>=0.24.0",
    "numpy>=2.5.2",
    "plotly>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/electro"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["EXE002"]
