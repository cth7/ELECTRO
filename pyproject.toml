[project]
name = "electro"
version = "0.1.0"
description = "Python package for generating ELECTRO sampling trajectories for 3D MRI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "array-api-compat>=1.16.0",
    "marimo[recommended]>=0.24.0",
    "numpy>=2.5.2",
    "plotly>=7.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
torch = [
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/electro"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "ty>=0.0.82",
]

# PyTorch builds for CUDA 12.6 are the newest that still support Pascal GPUs
# (e.g. GTX 1080 Ti). The index is explicit, so only torch is installed from it.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["EXE002"]
# marimo cells end with a bare return and show their output with a bare
# expression
"notebooks/*.py" = ["B018", "PLR1711"]
